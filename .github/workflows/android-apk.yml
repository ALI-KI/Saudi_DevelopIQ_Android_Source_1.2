name: Saudi DevelopIQ - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'scripts/mobile-check.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit mobile source and safety conditions
        run: npm run mobile:check

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run calculation engine tests
        run: npm run test

      - name: Build offline React app
        run: npm run mobile:build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Install app icons and splash images
        run: npx @capacitor/assets generate --android

      - name: Sync mobile app and native plugins
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SaudiDevelopIQ-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
